# ============================================================
# 劳有据 AI —— Nginx 站点配置模板（Phase 9/9A：轻量服务器 / 公网 IPv4 / HTTP）
# 安装：Debian 系 → /etc/nginx/sites-available/laoyouju + sites-enabled 软链；
#       OpenCloudOS/RHEL 系（conf.d 结构）→ /etc/nginx/conf.d/laoyouju.conf（由 install.sh 检测 include 结构后放置）
# 安全要点：
#   - 仅监听 80（本阶段不配置域名与 HTTPS）；
#   - / 提供静态前端（apps/web/out 静态导出），/api/ 反代本机 Node（127.0.0.1:9000）；
#   - X-Forwarded-For 用 $remote_addr 覆盖（不拼接外部自带转发头，防止伪造绕过限流）；
#   - client_max_body_size 与服务端 8KB 限制一致；敏感路径（/. 开头隐藏项与指定扩展名）拒绝。
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                # 仅通过公网 IPv4/本机访问；不配置域名

    server_tokens off;
    root /opt/laoyouju/current/apps/web/out;
    index index.html;

    client_max_body_size 8k;

    # 静态压缩（不引入 CDN；Nginx 自带 gzip）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    access_log /var/log/nginx/laoyouju.access.log;
    error_log  /var/log/nginx/laoyouju.error.log warn;

    # ---- 静态前端（Next.js 静态导出 + trailingSlash：目录型 /index.html）----
    # try_files 需要 $uri/ 目录匹配支持；不允许自动列出目录。
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---- API 反代：本机 Node API（仅回环监听）----
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        # 覆盖外部请求自带转发头（$remote_addr = 与 Nginx 建立连接的真实客户端 IP）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;   # 模型调用超时 15s + 余量
        proxy_send_timeout 30s;

        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- 敏感路径：一律拒绝（Phase 9A.1：同级+嵌套的“以 . 开头的路径段”均拒绝）----
    # 规则：(^|/)\..(?!well-known/) —— 任意位置（含嵌套 /x/.env、/x/.git/config）路径段以 . 开头即拒绝；
    #       负向前瞻仅放行根级 /.well-known/；不匹配 /api/、/laws/、/cases/、/ask/，也不匹配 _next/static/chunks/a.b.js（点前为普通字符）。
    location ~ (^|/)\.(?!well-known/) {
        deny all;
    }
    # 2) 指定文件扩展名（.env/.git/.sqlite3/.sqlite）结尾一律拒绝；不匹配 /api/v1/health 等。
    location ~* \.(env|git|sqlite3|sqlite)$ {
        deny all;
    }
}
